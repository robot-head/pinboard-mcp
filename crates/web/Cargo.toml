[package]
name = "pinboard-web"
version = "0.1.0"
edition = "2024"

[dependencies]
pinboard-core = { path = "../core" }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "PointerEvent", "MouseEvent", "WheelEvent", "KeyboardEvent", "DomRect", "Location", "Storage", "EventSource", "MessageEvent", "EventTarget", "Clipboard", "Navigator", "Url", "UrlSearchParams"] }
console_error_panic_hook = "0.1"
